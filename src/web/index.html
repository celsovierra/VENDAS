<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão de Vendas</title>
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}
body{display:flex;min-height:100vh;background:#f3f4f6;color:#111}
nav{width:220px;background:#111827;color:#fff;padding:20px}
nav h2{margin-bottom:20px;font-size:18px}
nav a{display:block;padding:10px;color:#d1d5db;text-decoration:none;border-radius:6px}
nav a:hover,nav a.on{background:#374151;color:#fff}
main{flex:1;padding:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:16px 0}
.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 1px 3px #0002}
.card b{display:block;font-size:26px;margin-top:6px}
table{width:100%;background:#fff;border-collapse:collapse;border-radius:10px;overflow:hidden}
th,td{padding:12px;text-align:left;border-bottom:1px solid #e5e7eb}
th{background:#f9fafb}
@media(max-width:700px){body{flex-direction:column}nav{width:100%}}
</style><link rel="stylesheet" href="/static/style.css"></head><body>
<nav><h2>📦 Vendas</h2>
<a class="on" href="/">Painel</a><a href="/pedidos">Pedidos</a><a href="#">Produtos</a>
<a href="#">Anúncios</a><a href="#">Etiquetas</a><a href="#">Financeiro</a><a href="/config">Configurações</a></nav>
<main><h1>Painel</h1>
<div class="cards">
<div class="card">Produtos<b id="n">0</b></div>
<div class="card">Pedidos<b id="pn">0</b></div>
<div class="card">Lucro<b id="pl">R$ 0,00</b></div></div>
<h3 style="margin:16px 0">Produtos cadastrados</h3>
<table><thead><tr><th>SKU</th><th>Título</th><th>Custo</th><th>Venda</th><th>Estoque</th></tr></thead>
<tbody id="t"></tbody></table><h3 style="margin:24px 0 12px">Novo produto</h3>
<form id="f" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;background:#fff;padding:16px;border-radius:10px;box-shadow:0 1px 3px #0002">
<input name="sku" placeholder="SKU" required>
<input name="title" placeholder="Título" required>
<input name="cost_price" type="number" step="0.01" placeholder="Custo (R$)">
<input name="sale_price" type="number" step="0.01" placeholder="Venda (R$)">
<input name="stock" type="number" placeholder="Estoque">
<input name="temu_url" placeholder="Link Temu">
<input name="temu_supplier" placeholder="Fornecedor Temu">
<button style="background:#111827;color:#fff;border:0;border-radius:6px;padding:10px;cursor:pointer">Salvar</button>
</form>
<style>input{padding:10px;border:1px solid #d1d5db;border-radius:6px}</style>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
const d=Object.fromEntries(new FormData(e.target));
['cost_price','sale_price'].forEach(k=>d[k]=parseFloat(d[k])||0);d.stock=parseInt(d.stock)||0;
const r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
if(r.ok)location.reload();else alert((await r.json()).detail||'Erro')}
</script>
<h3 style="margin:24px 0 12px">Pedidos <button onclick="this.textContent='Atualizando...';fetch('/api/ml/importar-vendas').then(r=>r.json()).then(d=>{alert('Novos: '+d.importados);location.reload()})" style="margin-left:12px;padding:6px 12px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer">Atualizar vendas</button></h3>
<table><thead><tr><th>Loja</th><th>Pedido</th><th>Cliente</th><th>Status</th><th>Total</th><th>Taxas</th><th>Frete</th><th>Custo</th><th>Lucro</th><th>Temu</th></tr></thead>
<tbody id="o"></tbody></table>
<script>
fetch('/api/orders').then(r=>r.json()).then(l=>{
const m=v=>'R$ '+v.toFixed(2);
document.getElementById('pn').textContent=l.length;document.getElementById('pl').textContent=m(l.filter(x=>x.status!=='cancelled').reduce((a,x)=>a+x.profit,0));document.getElementById('o').innerHTML=l.map(x=>`<tr><td>${x.marketplace}</td><td>${x.external_id}</td><td>${x.buyer_name||'-'}</td><td>${x.status}</td><td>${m(x.total)}</td><td>${m(x.marketplace_fee)}</td><td>${m(x.shipping_cost)}</td><td>${m(x.product_cost)}</td><td style="color:${x.profit>=0?'#059669':'#dc2626'}"><b>${m(x.profit)}</b></td><td>${x.temu_purchased?'Comprado':'Pendente'}</td></tr>`).join('')})
</script>
</main>
<script>
fetch('/api/products').then(r=>r.json()).then(l=>{
document.getElementById('n').textContent=l.length;
document.getElementById('t').innerHTML=l.map(p=>`<tr><td>${p.sku}</td><td>${p.title}</td><td>R$ ${p.cost_price.toFixed(2)}</td><td>R$ ${p.sale_price.toFixed(2)}</td><td>${p.stock}</td></tr>`).join('')})
</script><script src="/static/layout.js?v=7"></script></body></html>
